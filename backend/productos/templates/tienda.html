<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mutante | Tienda y Catálogo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header class="molinera-header">
        <div class="logo-area">
            <h1><a href="{% url 'inicio' %}" style="color: inherit; text-decoration: none;"> MOLINERA DE CAFE </a></h1>
            <p class="tagline">Del grano a tu mesa • Selección y molienda de especialidad</p>
        </div>
        
        <div style="display: flex; align-items: center; gap: 35px;">
            <ul class="nav-links" style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0;">
                <li><a href="{% url 'dashboard' %}">Inicio</a></li>
                <li><a href="{% url 'tienda' %}" class="active" style="color: var(--accent, #d4a373);">Tienda</a></li>
                <li id="menu-privado-perfil" style="display: none;"><a href="{% url 'perfil' %}">Mi Perfil</a></li>
                <li id="menu-privado-carrito" style="display: none;"><a href="{% url 'carrito' %}" class="nav-cart">🛒 Carrito</a></li>
            </ul>
            
            <div id="auth-seccion" style="display: flex; gap: 15px; align-items: center;">
                <button id="btn-nav-login" class="carrito-btn" style="background: transparent; border: 1px solid var(--accent, #d4a373); color: var(--accent, #d4a373);">Iniciar Sesión</button>
                <button id="btn-nav-registro" class="carrito-btn">Registrarse</button>
                
                <div id="nav-usuario-info" style="display: none; align-items: center; gap: 15px;">
                    <span id="nav-nombre-usuario" style="font-weight: bold; color: var(--accent, #d4a373);"></span>
                    <button class="carrito-btn" onclick="window.cerrarSesionCliente()" style="background-color: #8b0000; color: white;">Salir</button>
                </div>
            </div>
        </div>
    </header>

    {% include 'modales.html' %}

    <main class="contenedor-principal" style="padding: 40px 20px;">
        <div id="contenedor-tienda"></div>
    </main>

    <script src="{% static 'app.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica de visibilidad de sesión
            const token = localStorage.getItem('cliente_token');
            if (token) {
                const menuCarrito = document.getElementById('menu-privado-carrito');
                const menuPerfil = document.getElementById('menu-privado-perfil');
                const btnLogin = document.getElementById('btn-nav-login');
                const btnRegistro = document.getElementById('btn-nav-registro');
                const navUsuarioInfo = document.getElementById('nav-usuario-info');
                const navNombreUsuario = document.getElementById('nav-nombre-usuario');

                if (menuCarrito) menuCarrito.style.display = 'block';
                if (menuPerfil) menuPerfil.style.display = 'block';
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnRegistro) btnRegistro.style.display = 'none'; 
                if (navUsuarioInfo) navUsuarioInfo.style.display = 'flex';
                if (navNombreUsuario) navNombreUsuario.innerText = localStorage.getItem('usuario_nombre') || "Cliente";
            }

            // Eventos seguros para los modales
            const btnLogin = document.getElementById('btn-nav-login');
            if (btnLogin) {
                btnLogin.addEventListener('click', () => {
                    if (window.abrirModalAutenticacion) window.abrirModalAutenticacion();
                });
            }

            const btnRegistro = document.getElementById('btn-nav-registro');
            if (btnRegistro) {
                btnRegistro.addEventListener('click', () => {
                    if (window.abrirModalRegistro) window.abrirModalRegistro();
                });
            }
            
            // Cargar los productos agrupados automáticamente al abrir la tienda
            if (typeof cargarProductos === 'function') {
                cargarProductos();
            }
        });
    </script>
</body>
</html>
